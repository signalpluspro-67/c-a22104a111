r": 4, "rs": 0, "rp": 0, "d": "2025-05-12", "b": "If you find yourself trapped in theory, Act. \n\nThe universe responds to movement, not contemplation.\n\nIf you're constantly in motion, Reflect. \n\nFor action without meaning is merely distraction dressed as purpose. \n\nAnd that is all that separates progress from noise."}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-05-13", "b": "Seeking safety in the consensus?\n\nThat's the riskiest trade of all.\n\nTrue security isn't found in conformity.\n\nIt's built on conviction.\n\nForged in solitude, tested by doubt.\n\nInvest in your own clarity, not the crowd's comfort."}, {"r": 4, "rs": 0, "rp": 1, "d": "2025-05-13", "b": "The best financial plan isn't complex.\n\nIt's committed to.\n\nSpend less than you earn.\n\nInvest the difference wisely.\n\nProtect your downside.\n\nRepeat for decades.\n\nSimplicity, executed relentlessly, wins."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-13", "b": "Don't just buy stocks.\n\nInvest in understanding.\n\nUnderstand the business.\n\nUnderstand the value\n\n.Understand your own psychology.\n\nClarity precedes confident action."}, {"r": 4, "rs": 0, "rp": 0, "d": "2025-05-13", "b": "I can't believe it's already been 6 months since launching 'The Philosopher Investor'! 🧠📈\n\nA huge thank you to everyone who has subscribed and engaged with the ideas we're exploring at the intersection of markets and wisdom.\n\nIf you're also sharing your thoughts and writings on Substack (especially around investing, economics, or practical philosophy), please drop your link below. \n\nLet's discover, connect, and support each other's work! 👇"}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-05-13", "b": "Chaos"}, {"r": 9, "rs": 1, "rp": 0, "d": "2025-05-16", "b": "Action feels productive.\n\nInaction can be strategic.\n\nNot every dip is a buy.\n\nNot every rally is a sell.\n\nSometimes, the wisest move\n\nIs to simply observe, and wait.\n\nPatience is also a position."}, {"r": 7, "rs": 1, "rp": 0, "d": "2025-05-18", "b": "\"Should have bought.\"\n\n\"Should have sold.\"\n\nThe past is a classroom, not a prison.\n\nLearn the lesson, then let it go.\n\nFuture opportunities don't care about past mistakes.\n\nFocus forward, with wisdom gained.\n\nYour next move matters most."}, {"r": 3, "rs": 1, "rp": 0, "d": "2025-05-19", "b": "The illusion of control is a costly master.\n\nThe market owes no allegiance to our desires.\n\nEmbrace the dance of uncertainty with a prepared mind.\n\nFortify your spirit against fortune's whims.\n\nResilience is built in acknowledging what you cannot command.\n\nPeace is found in mastering your response, not the outcome."}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-05-19", "b": "The loudest voices rarely hold the deepest truths.\n\nWisdom often whispers."}, {"r": 5, "rs": 3, "rp": 0, "d": "2025-05-19", "b": "A single candle can illuminate a room. \n\nA single recommendation can expand a mind.\n\nIf \"The Philosopher Investor\" sparks insight for you, please consider sharing it via a Substack recommendation.\n\nWith appreciation."}, {"r": 3, "rs": 1, "rp": 0, "d": "2025-05-19", "b": "If you’re anxious—Zoom out.\n\nIf you’re stuck—Start small.\n\nIf you’re exhausted—Do less.\n\nIf you’re distracted—Simplify.\n\nIf you’re successful—Stay humble."}, {"r": 3, "rs": 1, "rp": 0, "d": "2025-05-20", "b": "Society celebrates those who predict market tops\n\nWisdom honors those who master themselves\n\nOne skill works occasionally\n\nThe other works eternally"}, {"r": 6, "rs": 1, "rp": 3, "d": "2025-05-20", "b": "Finance seeks to minimize risk.\n\nPhilosophy seeks to understand what is worth risking for.\n\nOne is about preservation.\n\nThe other, about purpose."}, {"r": 1, "rs": 0, "rp": 0, "d": "2025-05-21", "b": "Markets crash every few years, yet we're shocked each time\n\nLike forgetting that winter exists while buying summer clothes\n\nThe true edge isn't predicting the season\n\nBut building a wardrobe that works in all of them"}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-21", "b": "The anxious investor checks quotes hourly\n\nThe wise investor plants trees and forgets them\n\nBoth will arrive at the same destination\n\nOnly one enjoys the journey"}, {"r": 1, "rs": 1, "rp": 0, "d": "2025-05-22", "b": "Accept popular opinions.\n\nLive a life of borrowed thoughts.\n\nQuestion every assumption deeply.\n\nForge your own understanding."}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-05-22", "b": "Your portfolio reveals your philosophy.\n\nWhat you value.\n\nWhat you fear.\n\nWhat you understand.\n\nWhat you don't."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-22", "b": "Time is the ultimate investment.\n\nYou can't buy it back.\n\nYou can't compound it faster.\n\nYou can only choose\n\nhow wisely you spend it.\n\nInvest your time like your money:\n\ndeliberately, patiently, purposefully."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-23", "b": "Fear says \"What if I lose everything?\"\n\nGreed says \"What if I miss out?\"\n\nWisdom says \"What if I focus\n\non what I can control?\"\n\nControl the process, not the outcome."}, {"r": 1, "rs": 1, "rp": 0, "d": "2025-05-23", "b": "VIX on the move."}, {"r": 1, "rs": 0, "rp": 0, "d": "2025-05-23", "b": "Great timing lol"}, {"r": 6, "rs": 1, "rp": 0, "d": "2025-05-23", "b": "Marcus Aurelius owned the Roman Empire. \n\nHis advice on wealth?\n\n\"Very little is needed to make a happy life.\"\n\nThe Stoics understood: True wealth isn't having everything. \n\nIt's needing nothing."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-24", "b": "Descartes said: \"I think, therefore I am.\"\n\nThe investor's version: \"I doubt, therefore I research.\"\n\nQuestion every tip. \n\nQuestion every trend. \n\nQuestion every certainty.\n\nDoubt is your best defense against delusion."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-24", "b": "Rich people buy assets.\n\nPoor people buy liabilities.\n\nMiddle class buys both and wonders why they stay middle class.\n\nThe difference isn't income.\n\nIt's understanding what you're actually buying."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-24", "b": "Heraclitus: \"No man steps in the same river twice.\"\n\nYesterday's winning strategy won't work forever.\n\nLast decade's star stocks won't shine again.\n\nStay flexible.\n\nStay learning.\n\nStay evolving."}, {"r": 0, "rs": 0, "rp": 0, "d": "2025-05-25", "b": "Everyone wants financial freedom.\n\nFew want financial discipline.\n\nFreedom is earned through sacrifice.\n\nDiscipline is built through repetition.\n\nYour future wealth is created by today's choices.\n\nChoose wisely."}, {"r": 10, "rs": 1, "rp": 3, "d": "2025-05-25", "b": "Trading is a game of probabilities.\n\nInvesting is a game of patience.\n\nSpeculation is a game of chance.\n\nWealth building is a game of discipline.\n\nWhich game are you playing?"}, {"r": 7, "rs": 0, "rp": 1, "d": "2025-05-26", "b": "Lao Tzu: \"The journey of a thousand miles begins with a single step.\"\n\nYour first $100 invested matters more than your 10,000th.\n\nIt's not about the amount.\n\nIt's about the habit.\n\nStart small. \n\nStart today. \n\nStart building."}, {"r": 5, "rs": 1, "rp": 1, "d": "2025-05-27", "b": "The three pillars of wealth:\n\nEarn more.\n\nSpend less.\n\nInvest the difference.\n\nPhilosophy can't change math.\n\nBut it can change behavior.\n\nAnd behavior changes everything."}, {"r": 5, "rs": 1, "rp": 0, "d": "2025-05-27", "b": "The best investors are emotional amnesiacs.\n\nThey forget yesterday's gains.\n\nThey forget yesterday's losses.\n\nThey remember only today's opportunities.\n\nMemory is the enemy of objectivity."}, {"r": 3, "rs": 1, "rp": 0, "d": "2025-05-28", "b": "Check out this one from Run The Money.\n\nI was excited to cross post it as well 🔥\n\nThis piece explores what happens when you're successful on paper but slowly losing yourself in the process.\n\nWorth the read if you've ever felt like you're playing a character at work instead of being yourself.\n\nhttps://daviddomzalski.substack.com/p/money-rents-your-personality?r=3wm6q&utm_medium=ios&triedRedirect=true"}, {"r": 4, "rs": 1, "rp": 0, "d": "2025-05-28", "b": "\"We are what we repeatedly do.\" - Aristotle\n\nYour wealth isn't built by one great trade.\n\nIt's built by boring consistency:\n\n$500 monthly for 20 years = $240,000\n\nOne \"life-changing\" bet = Usually $0\n\nExcellence in investing is a habit, not an act."}, {"r": 4, "rs": 0, "rp": 0, "d": "2025-05-29", "b": "🎉 100 subscribers milestone reached!\n\nA symbolic number, but it feels significant.\n\n100 people chose to spend their attention on philosophy meets investing.\n\n100 people believed this blend of ancient wisdom and modern markets was worth their time.\n\nThis is just the beginning."}, {"r": 4, "rs": 0, "rp": 1, "d": "2025-05-29", "b": "The market rewards two emotions:\n\nBoredom and stubbornness.\n\nGet bored with checking prices.\n\nGet stubborn about staying invested."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-05-30", "b": "A monk asked his master: \"What is the difference between wisdom and cleverness?\"\n\nThe master replied: \"Watch the village below.\"\n\nThey saw a clever merchant buying low, selling high, making quick profits. The villagers called him brilliant.\n\nThey also saw a simple farmer, quietly buying one small plot of land each year for decades.\n\ndivider\n\nTwenty years later:\n\nThe clever merchant had lost everything in a single bad trade.\n\nThe simple farmer owned half the valley.\n\n\"Cleverness,\" said the master, \"tries to outsmart time. Wisdom partners with it.\"\n\nYour portfolio: clever trades or patient accumulation?"}, {"r": 6, "rs": 0, "rp": 1, "d": "2025-06-01", "b": "Your money has three jobs:\n\nSurvive today.\n\nSecure tomorrow.\n\nServe others.\n\nIf it's not doing all three, you're not wealthy.\n\nYou're just rich."}, {"r": 4, "rs": 0, "rp": 1, "d": "2025-06-02", "b": "Time doesn't heal financial wounds.\n\nTime deepens them.\n\nA $1,000 mistake at 25 costs $32,000 by retirement.\n\nA $1,000 investment at 25 becomes $32,000 by retirement.\n\nSame amount. \n\nOpposite outcomes."}, {"r": 18, "rs": 1, "rp": 5, "d": "2025-06-03", "b": "The poor work for money.\n\nThe middle class work for status.\n\nThe wealthy work for assets.\n\nAssets work while you sleep.\n\nStatus dies when you retire.\n\nMoney disappears when you spend it."}, {"r": 8, "rs": 1, "rp": 1, "d": "2025-06-04", "b": "Inflation isn't just stealing your money.\n\nIt's stealing your dreams at yesterday's prices.\n\nThe house you wanted.\n\nThe retirement you planned.\n\nThe future you calculated.\n\nFight back with assets, not cash."}, {"r": 9, "rs": 2, "rp": 3, "d": "2025-06-06", "b": "Your grandparents built wealth with 3% savings accounts.\n\nYou complain about 5% stock returns.\n\nThe problem isn't the market.\n\nIt's your expectations.\n\nLower your expectations.\n\nRaise your patience.\n\nWatch magic happen."}, {"r": 7, "rs": 1, "rp": 0, "d": "2025-06-07", "b": "Money doesn't corrupt people.\n\nIt reveals them.\n\nThe generous become more generous.\n\nThe fearful become more fearful.\n\nThe greedy become more greedy.\n\nThe wise become more wise.\n\nMoney is a magnifying glass, not a transformation."}, {"r": 3, "rs": 0, "rp": 1, "d": "2025-06-09", "b": "Inflation is the government's way of defaulting without admitting it.\n\nThey can't pay back what they borrowed.\n\nSo they pay back with cheaper dollars.\n\nYour savings fund their spending.\n\nYour purchasing power pays their bills.\n\nYou're being taxed through debasement."}, {"r": 13, "rs": 1, "rp": 2, "d": "2025-06-10", "b": "Retirement isn't an age.\n\nIt's a number.\n\nThe number where your assets work harder than you do.\n\nThe number where your money makes more money than your job.\n\nThe number where compound interest pays your bills.\n\nThe number where you become unemployable by choice.\n\nStop counting years. Start counting dollars."}, {"r": 9, "rs": 0, "rp": 2, "d": "2025-06-11", "b": "The Spartans trained in winter so they'd be ready for war.\n\nThe Stoics practiced poverty so they'd be ready for loss.\n\nPractice living on half your income.\n\nWhen markets crash, you'll be ready for opportunity."}, {"r": 7, "rs": 0, "rp": 3, "d": "2025-06-14", "b": "The ancient Library of Alexandria burned.\n\nCenturies of knowledge—gone in one night.\n\nBut mathematical principles survived\n\nBecause they lived in multiple minds.\n\nDiversification is your library of Alexandria:\n\nSpread your wealth across multiple assets\n\nSo no single fire can destroy everything."}, {"r": 7, "rs": 0, "rp": 3, "d": "2025-06-15", "b": "Pascal's Wager applied to investing:\n\nYou can't know if the market will crash tomorrow.\n\nBut the cost of being wrong about NOT investing\n\n(missing decades of compound growth)\n\nfar exceeds the cost of being wrong about investing\n\n(temporary portfolio declines).\n\nBet on the market's long-term ascent.\n\nThe downside of being wrong is manageable.\n\nThe upside of being right is life-changing."}, {"r": 12, "rs": 0, "rp": 1, "d": "2025-06-16", "b": "Buddha: \"Attachment is the root of suffering.\"\n\nYour biggest investment losses come from attachment:\n\nAttached to a stock that's falling\n\nAttached to a strategy that's failing\n\nAttached to an outcome that's not coming\n\nDetachment isn't indifference.\n\nIt's the freedom to make rational decisions."}, {"r": 8, "rs": 0, "rp": 1, "d": "2025-06-18", "b": "Every dollar in your bank account\n\nRepresents stored human energy and time.\n\nWhen you invest, you're not moving money.\n\nYou're redirecting the accumulated life force\n\nOf everyone who came before you.\n\nTreat it with reverence."}, {"r": 2, "rs": 0, "rp": 1, "d": "2025-06-20", "b": "Van Gogh sold one painting in his lifetime.\n\nToday his works sell for hundreds of millions.\n\nThe art world didn't change its mind about Van Gogh.\n\nTime revealed what was always true.\n\nAmazon dropped 90% in the dot-com crash.\n\nTesla fell 60% in 2022.\n\nThe companies didn't change.\n\nThe market's perception caught up to reality.\n\nPrice is what you pay.\n\nValue is what you wait to be recognized."}, {"r": 13, "rs": 0, "rp": 1, "d": "2025-06-21", "b": "A taxi driver in Mumbai told me:\n\n\"Sir, I drive the same route every day for 20 years.\n\nSome days traffic is terrible, some days is smooth.\n\nBut every day, I reach my destination.\"\n\n\"The stock market is same-same.\n\nSome days up, some days down.\n\nBut every 20 years, everyone reach destination who keeps driving.\"\n\nWisdom often comes from the most unexpected places."}, {"r": 8, "rs": 0, "rp": 1, "d": "2025-06-25", "b": "Every great fortune began\n\nas someone's crazy idea\n\nabout what other people would want\n\nbefore they knew they wanted it.\n\nWealth is prophesy made profitable."}, {"r": 7, "rs": 0, "rp": 0, "d": "2025-06-26", "b": "Your phone battery gets more daily attention\n\nthan your retirement account.\n\nYou charge your phone every night\n\nbut check your investments once a year.\n\nThe device dies in 24 hours.\n\nYour future dies in 24 years."}, {"r": 6, "rs": 0, "rp": 2, "d": "2025-06-29", "b": "Risk isn't losing money.\n\nRisk is working until you die.\n\nRisk is depending on others for your survival.\n\nRisk is having no options when life changes.\n\nThe riskiest thing you can do is play it safe."}, {"r": 10, "rs": 1, "rp": 1, "d": "2025-06-30", "b": "Every millionaire has the same morning routine:\n\nThey wake up and don't check their portfolio.\n\nObsessing over daily fluctuations is like checking your weight every hour while dieting.\n\nTrust the process, not the noise."}, {"r": 5, "rs": 1, "rp": 0, "d": "2025-07-01", "b": "Poverty is inherited through beliefs, not bloodlines.\n\n\"Money doesn't grow on trees.\"\n\n\"Rich people are greedy.\"\n\n\"We can't afford that.\"\n\nThese phrases become financial DNA.\n\nBreak the generational curse.\n\nRewrite your money story."}, {"r": 15, "rs": 2, "rp": 1, "d": "2025-07-02", "b": "Your portfolio is a philosophy made visible.\n\nConservative investors believe the world is dangerous.\n\nGrowth investors believe the future is brighter.\n\nValue investors believe truth eventually surfaces.\n\nYour asset allocation is your worldview in spreadsheet form."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-07-04", "b": "Every price is a lie.\n\nEvery market cap is fiction.\n\nEvery valuation is consensus hallucination.\n\nYet these shared delusions build cities, fund dreams, and reshape reality.\n\nThe most powerful force in finance isn't logic—it's collective belief."}, {"r": 5, "rs": 0, "rp": 0, "d": "2025-07-05", "b": "Leverage is borrowed confidence.\n\nYou're so sure you're right, you'll bet money you don't have.\n\nEvery margin trade is hubris made mathematical.\n\nThe gods punish pride through margin calls."}, {"r": 13, "rs": 2, "rp": 0, "d": "2025-07-06", "b": "Patience isn't passive.\n\nIt's active.\n\nThe deliberate choice to wait.\n\nThe quiet strength to observe.\n\nThe unwavering faith in process.\n\nTrue growth demands deep roots.\n\nNot just quick blooms."}, {"r": 6, "rs": 0, "rp": 0, "d": "2025-07-06", "b": "New article just published!"}, {"r": 8, "rs": 1, "rp": 2, "d": "2025-07-09", "b": "Meditation teaches you to observe thoughts without acting. \n\nInvesting teaches you to observe prices without acting.\n\nBoth require the same muscle: The ability to sit still while chaos swirls."}, {"r": 5, "rs": 1, "rp": 0, "d": "2025-07-11", "b": "The opposite of poverty isn't wealth.\n\nIt's options.\n\nPoverty is having one choice forced upon you.\n\nWealth is having many choices available to you.\n\nMoney doesn't buy happiness.\n\nIt buys the luxury of unhappiness on your own terms."}, {"r": 9, "rs": 0, "rp": 2, "d": "2025-07-12", "b": "Your first million is the hardest.\n\nNot because of the math.\n\nBecause it requires becoming someone new.\n\nSomeone who delays gratification.\n\nSomeone who thinks in systems.\n\nSomeone who sees opportunity in problems.\n\nWealth isn't about having money.\n\nIt's about becoming someone who can keep it."}, {"r": 5, "rs": 0, "rp": 0, "d": "2025-07-14", "b": "Knowledge alone doesn't build wealth.\n\nApplication does.\n\nApply through daily choices.\n\nApply through reviewed mistakes.\n\nApply through ethical decisions.\n\nApplication is wisdom embodied."}, {"r": 6, "rs": 1, "rp": 2, "d": "2025-07-15", "b": "So, today in France, the Prime Minister said he wants to take away two public holidays to help pay back the national debt. That’s a big deal here. People have started revolutions for less."}, {"r": 16, "rs": 2, "rp": 5, "d": "2025-07-23", "b": "The hardest position to hold isn't losing money.\n\nIt's holding cash while others get rich.\n\nPatience feels like punishment."}, {"r": 16, "rs": 2, "rp": 3, "d": "2025-07-25", "b": "The stock market is humanity's largest shared hallucination.\n\nNumbers on screens representing slices of companies representing hopes for the future.\n\nBut shared hallucinations become reality when enough people believe.\n\nBelieve in the hallucination. Question your part in it."}, {"r": 18, "rs": 3, "rp": 4, "d": "2025-07-27", "b": "Compound interest is just delayed gratification with math.\n\n$100 today or $1,000 in 20 years?\n\nMost people can't wait 20 minutes for coffee to brew. \n\nYet fortunes are built by those who can wait 20 years for wealth to grow.\n\nTime is the ultimate competitive advantage."}, {"r": 16, "rs": 2, "rp": 2, "d": "2025-07-28", "b": "Your investment plan should work even if you forget about it.\n\nThe best strategies run on autopilot. \n\nThe worst ones demand constant attention.\n\nSet it. Forget it. Get rich slowly."}, {"r": 13, "rs": 3, "rp": 2, "d": "2025-07-30", "b": "Every stock tip is someone else's exit strategy.\n\nWhen they're telling you to buy, they're planning to sell.\n\nThe most expensive advice comes disguised as free recommendations."}, {"r": 6, "rs": 2, "rp": 1, "d": "2025-07-31", "b": "The market doesn't care about your story.\n\nYour mortgage payment.\n\nYour retirement timeline.\n\nYour family's needs.\n\nYour personal struggles.\n\nIt rewards discipline, not desperation.\n\nPatience, not pressure.\n\nLogic, not love.\n\nThe market is indifferent.\n\nYour strategy can't be."}, {"r": 10, "rs": 2, "rp": 0, "d": "2025-08-03", "b": "Enough isn't a number.\n\nIt's a decision.\n\nYou can have millions and feel poor.\n\nYou can have thousands and feel rich.\n\nDefine your enough.\n\nThen defend it."}, {"r": 15, "rs": 2, "rp": 0, "d": "2025-08-04", "b": "Your money compounds. So do your habits.\n\nBad decisions multiply. Good choices accumulate.\n\nEvery small action today becomes tomorrow's reality.\n\nInvest in both your portfolio and your patterns."}, {"r": 1, "rs": 0, "rp": 0, "d": "2025-11-09", "b": "“Money is a tool, not the goal. It is a means to an end, not the end itself. The ethical use of money is to create the greatest good for the greatest number of people.” – Philosopher, Aristotle"}, {"r": 1, "rs": 0, "rp": 0, "d": "2025-11-16", "b": "Price Is the Truth. Everything Else Is Commentary\n\nIgnore the news.\n\nIgnore the thesis.\n\nIgnore your ego.\n\nThe chart is talking.\n\nAre you listening?\n\nVolume speaks louder than conviction.\n\nStructure beats story."}, {"r": 1, "rs": 0, "rp": 0, "d": "2025-11-16", "b": "The market tempts you to act. \n\nSometimes, the most profitable move is no move at all"}, {"r": 2, "rs": 0, "rp": 1, "d": "2025-11-17", "b": "You don’t rise to the level of your goals. \n\nYou fall to the level of your habits.\n\nIn markets and in life, consistency compounds more than intensity.\n\nSmall steady actions build silent empires."}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-11-17", "b": "Financial independence isn't about never working again.\n\nIt's about never having to tolerate what you don't respect.\n\nFreedom is choosing your problems, not eliminating them.\n\nThe goal isn't zero problems. The goal is better problems."}, {"r": 5, "rs": 0, "rp": 0, "d": "2025-11-18", "b": "The gap between knowing and doing is where fortunes vanish.\n\nInformation is abundant.\n\nExecution is rare.\n\nWisdom without action is just expensive entertainment."}, {"r": 6, "rs": 1, "rp": 2, "d": "2025-11-18", "b": "Price is what you pay.\n\nValue is what you get.\n\nIn stocks.\n\nIn relationships.\n\nIn experiences.\n\nDon't be a bargain hunter in a quality world.\n\nInvest in what lasts, even if it costs more today."}, {"r": 3, "rs": 0, "rp": 1, "d": "2025-11-19", "b": "The poor sell time to get money. The rich sell money to get time.\n\nThis is the ultimate arbitrage.\n\nIf a task costs less to outsource than your hourly rate, buy the time. \n\nIf a purchase saves you hours of frustration, buy the peace.\n\nMoney is a renewable resource. \n\nTime is not."}, {"r": 6, "rs": 0, "rp": 1, "d": "2025-11-19", "b": "Seneca said, \"It is not the man who has too little, but the man who craves more, that is poor.\"\n\nFinancial freedom isn't a number in a bank account. It is the point where your desires no longer exceed your means.\n\nIf your lifestyle inflates as fast as your income, you are running on a treadmill, not building a ladder.\n\nWealth is the gap between your ego and your income."}, {"r": 27, "rs": 3, "rp": 9, "d": "2025-11-20", "b": "Money is just stored time. \n\nWhen you waste money, you aren't losing currency. \n\nYou are deleting the hours of your life it took to earn it.\n\nEvery purchase is a trade: Is this object worth 4 hours of my life? \n\nIs this status symbol worth 2 weeks of my freedom?"}, {"r": 13, "rs": 2, "rp": 5, "d": "2025-11-21", "b": "The best investors aren't the smartest.\n\nThey're the ones who can do nothing when nothing is the right move.\n\nDiscipline isn't about action. \n\nSometimes it's about restraint."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-11-22", "b": "Risk isn't what you think it is.\n\nThe real risk is never starting.\n\nWorking forty years for someone else's dream.\n\nTrading your entire life for the illusion of security.\n\nPlaying it safe is the riskiest bet of all."}, {"r": 6, "rs": 0, "rp": 1, "d": "2025-11-23", "b": "The market doesn't care about your stress.\n\nYour body does.\n\nChecking prices every hour won't change outcomes. It only changes your cortisol levels.\n\nSet your strategy. \n\nTrust your system. \n\nClose the app."}, {"r": 3, "rs": 0, "rp": 1, "d": "2025-11-25", "b": "You don't need more information.\n\nYou need better filters. You need clearer principles. \n\nYou need the courage to say no.\n\nWisdom is knowing what to ignore."}, {"r": 4, "rs": 1, "rp": 0, "d": "2025-11-26", "b": "Market crashes don't destroy wealth.\n\nThey transfer it.\n\nFrom the impatient to the patient. \n\nFrom the emotional to the rational. \n\nFrom the reactive to the prepared.\n\nWhich side will you be on?"}, {"r": 5, "rs": 1, "rp": 0, "d": "2025-11-27", "b": "Nobody got rich from one big win.\n\nThey got rich from not losing catastrophically.\n\nSurvival first. Success second.\n\nYou can't compound from zero."}, {"r": 2, "rs": 0, "rp": 0, "d": "2025-11-28", "b": "The Stoics knew: control what you can, accept what you cannot.\n\nYou can't control:\n\n\n\n\n\nMarket returns\n\n\n\nEconomic cycles\n\n\n\nGlobal events\n\nYou can control:\n\n\n\n\n\nYour savings rate\n\n\n\nYour asset allocation\n\n\n\nYour emotional reactions\n\nFocus accordingly."}, {"r": 7, "rs": 0, "rp": 1, "d": "2025-11-30", "b": "\"There is nothing new in Wall Street.\"\n\nLivermore wrote that in 1923.\n\nA century later: same greed, same fear, same mistakes. \n\nYour edge isn't information. \n\nYour edge is knowing what never changes."}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-12-07", "b": "New post live! Share it if you like it. Cheers"}, {"r": 3, "rs": 0, "rp": 0, "d": "2025-12-07", "b": "Got $ZIM?\n\nBreakout. Buyout whispers. Shorts trapped.\n\nThis one's heating up. 🔥"}, {"r": 7, "rs": 0, "rp": 0, "d": "2025-12-07", "b": "My grandfather never made more than $40k a year.\n\nLeft $2.3M to his kids.\n\nHis secret? He never sold.\n\nNot in '87. Not in '08. Not ever.\n\nBoring works."}, {"r": 9, "rs": 0, "rp": 1, "d": "2025-12-08", "b": "My father-in-law bought Amazon in 2001.\n\nSold it three months later for a 15% gain.\n\n\"Took my profits,\" he still says.\n\nThat 15% would be 30,000% today.\n\nPatience isn't just a virtue. It's the whole game."}, {"r": 64, "rs": 3, "rp": 19, "d": "2025-12-09", "b": "I know a guy who only invests in companies he's been a customer of for 10+ years.\n\nHis portfolio: Costco, Home Depot, his regional bank, John Deere.\n\nNo screens. No ratios. No newsletters.\n\n\"If I've trusted them with my money as a customer, I'll trust them with my money as an owner.\"\n\nHe's up 14% annually for 18 years."}, {"r": 8, "rs": 0, "rp": 0, "d": "2025-12-10", "b": "I asked an 80-year-old investor what he wished he'd known at 30.\n\nHe didn't mention stocks. He didn't mention timing.\n\n\"I wish I'd known that money was never the point. Freedom was. I spent 40 years optimizing the wrong variable.\"\n\nKnow what you're actually solving for."}, {"r": 119, "rs": 9, "rp": 26, "d": "2025-12-11", "b": "The best investors are boring.\n\nThey don't chase.\n\nThey don't panic.\n\nThey don't show off.\n\nThey just repeat what works.\n\nDiscipline looks dull.\n\nUntil you see the results."}, {"r": 4, "rs": 0, "rp": 0, "d": "2025-12-12", "b": "Most people don’t lose money to the market.\n\nThey lose it to themselves.\n\nImpulse. Ego. Impatience.\n\nBuild systems that protect you from you."}, {"r": 7, "rs": 1, "rp": 0, "d": "2025-12-13", "b": "Don’t confuse movement with progress.\n\nMore trades ≠ more skill.\n\nSometimes the highest-skill move is: no move."}, {"r": 299, "rs": 18, "rp": 76, "d": "2025-12-14", "b": "Everyone wants to be Warren Buffett. \n\nNo one wants to read for six hours a day. \n\nNo one wants to say no to 99 opportunities. \n\nNo one wants to wait 60 years.\n\nYou admire the results. \n\nYou ignore the process."}, {"r": 23, "rs": 0, "rp": 3, "d": "2025-12-15", "b": "Nietzsche said: \"He who has a why can bear almost any how.\" \n\nAssign your investments a purpose. \n\nMoney without meaning evaporates in the heat of the next temptation."}, {"r": 31, "rs": 3, "rp": 6, "d": "2025-12-16", "b": "Newton lost a fortune chasing the South Sea bubble.\n\nThe man who understood gravity couldn't resist greed.\n\nIntelligence doesn't protect you. \n\nSelf-knowledge does.\n\nKnow your weaknesses before the market reveals them."}, {"r": 19, "rs": 1, "rp": 1, "d": "2025-12-17", "b": "Peter Thiel asks one question:\n\n\"What important truth do very few people agree with you on?\"\n\nMost investors never ask this.\n\nThey buy what's popular. They follow the crowd. They seek consensus.\n\nBut consensus means it's already priced in.\n\nThe edge is in the unpopular truth you hold before others see it.\n\nContrarian isn't about being different.\n\nIt's about being right when others aren't ready."}, {"r": 12, "rs": 1, "rp": 0, "d": "2025-12-18", "b": "The Stoics practiced premeditatio malorum, the premeditation of evils.\n\nThey imagined the worst before it arrived.\n\nDo this with your portfolio.\n\nWhat if it drops 40%? \n\nWhat if your thesis breaks? \n\nWhat if you're wrong for years?\n\nIf you can't stomach the answer, you're overexposed.\n\nRisk management starts in the imagination."}, {"r": 17, "rs": 1, "rp": 4, "d": "2025-12-20", "b": "The Subtraction Portfolio\n\nMost investors keep adding.\n\nMore stocks. \n\nMore ETFs. \n\nMore complexity.\n\nThe best investors subtract.\n\nFewer positions. \n\nFewer decisions. \n\nFewer chances to be wrong.\n\nSimplicity compounds."}, {"r": 94, "rs": 1, "rp": 32, "d": "2025-12-21", "b": "200 subscribers. Milestone unlocked. 🎯\n\nThank you for being here.\n\nThank you for reading.\n\nThank you for sharing.\n\nNext target: 500.\n\nWe're just getting started. 🚀"}, {"r": 6, "rs": 0, "rp": 2, "d": "2025-12-23", "b": "Great news, $ZIM is waking up.\n\nWe flagged this one in the Dec 7th recap around $20.\n\nNow it's pushing $22+ pre-market.\n\nStill early. Still has legs.\n\n$30+ is very possible from here."}, {"r": 25, "rs": 1, "rp": 4, "d": "2025-12-24", "b": "You will never feel ready to invest. \n\nNever feel ready to start. \n\nNever feel ready to hold through the storm.\n\nReadiness is a myth.\n\nThe only real question:\n\nWill you act despite not feeling ready?\n\nThat's where wealth begins."}, {"r": 18, "rs": 0, "rp": 6, "d": "2025-12-24", "b": "M2 money supply since 1960. Amazing Growth. Up only!"}, {"r": 42, "rs": 1, "rp": 2, "d": "2025-12-26", "b": "Central banks print money. \n\nCentral banks buy gold.\n\nRead that again.\n\nThey don't trust their own creation. \n\nWhy should you?"}, {"r": 10, "rs": 1, "rp": 1, "d": "2025-12-26", "b": "Silver has nearly surpassed Nvidia in total market cap to close out 2025.\n\nThe market cap of a metal pulled from the earth is rivaling the architect of the AI revolution.\n\nWe are witnessing the revenge of the atoms.\n\nInsane."}, {"r": 31, "rs": 2, "rp": 3, "d": "2025-12-27", "b": "Seneca lost everything twice and rebuilt it both times.\n\nNot because he was lucky. \n\nBecause he understood something most never will:\n\nWealth isn't what you accumulate. \n\nIt's what you become in the process of building it.\n\nThey can take your money. \n\nThey can never take your capacity to create it again."}, {"r": 33, "rs": 1, "rp": 2, "d": "2025-12-27", "b": "Silver just flipped Oil.\n\n1 oz > 1 Barrel.\n\nHistory in the making."}, {"r": 6, "rs": 0, "rp": 0, "d": "2025-12-27", "b": "This is the chart they aren’t showing you on the evening news. \n\nThe \"Resilient Consumer\" narrative is officially dead.\n\nThe government says the labor market is strong.\n\nThe American family says they are being squeezed.\n\nOne of them is lying. \n\nThe chart shows which one."}, {"r": 28, "rs": 0, "rp": 2, "d": "2025-12-28", "b": "Heraclitus watched a river and understood everything:\n\n\"No man steps in the same river twice.\"\n\nThe company you bought last year doesn't exist anymore. \n\nNeither do you.\n\nReassess constantly."}, {"r": 28, "rs": 0, "rp": 2, "d": "2025-12-31", "b": "Pythagoras taught his students to observe silence for five years before speaking.\n\nImagine if investors did the same.\n\nFive years of watching.\n\nFive years of learning. \n\nFive years before making a single trade.\n\nPatience isn't passive. \n\nIt's preparation."}, {"r": 8, "rs": 0, "rp": 1, "d": "2026-01-01", "b": "Dostoevsky asked: \n\n\"What is hell? The suffering of being unable to love.\"\n\nWhat's financial hell?\n\nWealth without generosity. \n\nSuccess without gratitude. \n\nRiches without relationships.\n\nBuild a portfolio worth having. \n\nBuild a life worth living."}, {"r": 18, "rs": 1, "rp": 2, "d": "2026-01-02", "b": "Anaxagoras said everything contains a piece of everything else.\n\nA seed contains the tree. \n\nA drop contains the ocean.\n\nYour first €100 invested? \n\nIt contains your future freedom.\n\nYou just can't see it yet.\n\nEvery small investment holds the whole. \n\nStart anyway."}, {"r": 8, "rs": 0, "rp": 0, "d": "2026-01-02", "b": "Energy inflation is running at 4.2%.\n\nThe Fed calls this \"progress.\"\n\nCore CPI sits at 2.6%. \n\nThe headline number everyone celebrates.\n\nFood is up 2.6%. \n\nEnergy is up 4.2%. \n\nThese are not abstract categories. \n\nThis is your grocery bill. \n\nYour heating bill. \n\nCentral bankers love to exclude food and energy from their preferred measures. \n\nConvenient. \n\nThe things you actually need to survive are the things they choose to ignore.\n\nInflation is not defeated. \n\nIt is rebranded."}, {"r": 96, "rs": 7, "rp": 22, "d": "2026-01-03", "b": "Unpopular truth:\n\nMost people don't want to be rich. \n\nThey want to feel rich.\n\nThat's why they buy cars instead of stocks. \n\nClothes instead of assets. \n\nStatus instead of freedom.\n\nLooking rich and being rich are opposite strategies.\n\nPick one."}, {"r": 3, "rs": 0, "rp": 0, "d": "2026-01-03", "b": "Private sector wage growth just hit 0.8%.\n\nBack to 2017-2019 levels.\n\nThe 2022 spike above 1.4%? Completely erased.\n\nGovernment wages now running higher than private. Look at the crossover.\n\nWorkers had leverage two years ago.\n\nNot anymore."}, {"r": 6, "rs": 0, "rp": 2, "d": "2026-01-04", "b": "Hegesias was called \"The Death-Persuader.\"\n\nHe argued life's pleasures never outweigh its pains.\n\nDepressing? \n\nMaybe.\n\nBut he understood something investors forget:\n\nAvoiding loss matters more than chasing gain.\n\nProtect your downside. \n\nThe upside protects itself."}, {"r": 312, "rs": 35, "rp": 66, "d": "2026-01-05", "b": "Nobody talks about financial loneliness.\n\nThe silence when you're saving while friends are spending. \n\nThe doubt when you're investing while others are vacationing. \n\nThe isolation of delayed gratification.\n\nIt's real. \n\nIt's hard. \n\nIt's temporary.\n\nThe lonely path leads to freedom."}, {"r": 9, "rs": 0, "rp": 1, "d": "2026-01-05", "b": "Screen consumer stocks by geography.\n\nFRED data shows Sun Belt metros running 4.8%+ unemployment. \n\nTexas and Midwest under 3.4%.\n\nNational retail earnings will say \"mixed results.\"\n\nThe real story: Sun Belt heavy names will miss. \n\nMidwest exposure will hold.\n\nThe map tells you which names before the print does."}, {"r": 6, "rs": 0, "rp": 2, "d": "2026-01-06", "b": "The Taoists understood: wu wei. \n\nAction through non-action. \n\nEffortless effort. \n\nWinning by not fighting.\n\nMost investors lose because they do too much. \n\nToo much trading. \n\nToo much thinking. \n\nToo much reacting.\n\nToo much forcing."}, {"r": 38, "rs": 0, "rp": 4, "d": "2026-01-06", "b": "The richest man in the room is the one who stopped counting."}, {"r": 10, "rs": 0, "rp": 2, "d": "2026-01-07", "b": "The best trade you'll ever make is the one you didn't need to tell anyone about."}, {"r": 9, "rs": 0, "rp": 0, "d": "2026-01-07", "b": "We're Pricing In Buying a Country\n\nRead that again.\n\nThere is a liquid market. \n\nWith real money. \n\nWhere adults are betting on the United States purchasing a landmass the size of Mexico.\n\nFrom a NATO ally. \n\nWho said no. \n\nRepeatedly.\n\nAnd it's not at 1%. It's at 15%.\n\nInsane!"}, {"r": 15, "rs": 1, "rp": 1, "d": "2026-01-08", "b": "Lev Shestov wrote that certainty is the death of thought.\n\nCertainty is also the death of portfolios.\n\nThe moment you're sure, you stop questioning.\n\nThe moment you stop questioning, the market humbles you.\n\nStay uncertain. \n\nStay curious. \n\nStay solvent."}, {"r": 12, "rs": 0, "rp": 0, "d": "2026-01-08", "b": "Lev Shestov wrote that certainty is the death of thought.\n\nCertainty is also the death of portfolios.\n\nThe moment you're sure, you stop questioning.\n\nThe moment you stop questioning, the market humbles you.\n\nStay uncertain. \n\nStay curious. \n\nStay solvent."}, {"r": 27, "rs": 1, "rp": 4, "d": "2026-01-09", "b": "Józef Tischner wrote that the opposite of hope isn't despair, it's nostalgia.\n\nInvestors drown in nostalgia.\n\n\"I should've bought Bitcoin in 2013.\"\n\n\"I should've sold before the crash.\"\n\n\"I should've known.\"\n\nBut nostalgia is hope pointed backwards.\n\nIt paralyzes.\n\nThe market doesn't care what you should've done.\n\nOnly what you do now.\n\nLet go of the portfolio you could've had.\n\nBuild the one you still can."}, {"r": 55, "rs": 0, "rp": 6, "d": "2026-01-10", "b": "Markets will humble you again and again. \n\nFind meaning in the process, not just the outcome."}, {"r": 1, "rs": 0, "rp": 0, "d": "2026-01-10", "b": "Maduro kidnapped. \n\nProtests in Tehran. \n\nTrump eyeing Greenland.\n\nAnd yet... markets don't care.\n\nPrice makes the news, not the other way around.\n\nThis week's Market Recap breaks down what actually matters:\n\n- Breadth Score: 76/100\n\n- Divergences to watch\n\n- Trade of the Week: $CORT\n\nRead it here 👇"}, {"r": 27, "rs": 2, "rp": 3, "d": "2026-01-12", "b": "Most people trade time for money.\n\nThen they trade money for things.\n\nThen they need more time to earn more money to buy more things.\n\nThe loop never ends.\n\nBreak it.\n\nTrade money for time instead. \n\nIt's the only asset you can't earn back."}, {"r": 6, "rs": 0, "rp": 1, "d": "2026-01-13", "b": "Marcus Aurelius wrote Meditations during a plague.\n\nRome was crumbling. \n\nHe never meant for anyone to read it.\n\nJust a man writing to himself. \n\nTrying to stay disciplined.\n\n2,000 years later, we still read it.\n\nKeep a trading journal.\n\nNot for anyone else. \n\nFor the person you're becoming."}, {"r": 2, "rs": 0, "rp": 0, "d": "2026-01-13", "b": "🎯 ZIM Update: +22% Winner — Taking Profits\n\nQuick update on our December 7th Trade of the Week.\n\nZIM hit $24.45 yesterday.\n\nEntry at $20.03. That's +22% in five weeks.\n\nHere's what I wrote on December 7th:\n\n\n\n\"This is a high-momentum breakout play with a potential 'short squeeze' kicker... If the stock can hold above $20, the next major target is likely the $25.00 level.\"\n\nWe're knocking on that door.\n\nWhat I'm doing: Reducing size. Always nice to take profits. Move your stop  and let the rest ride.\n\nHope you were able to follow this one."}, {"r": 11, "rs": 0, "rp": 3, "d": "2026-01-13", "b": "if you have less than 100k subscribers, hi! i’d love to connect with you!"}, {"r": 14, "rs": 1, "rp": 1, "d": "2026-01-14", "b": "Selling too early isn't a mistake.\n\nIt's a fear of deserving more."}, {"r": 33, "rs": 2, "rp": 3, "d": "2026-01-14", "b": "Your thesis doesnt need to be complicated.\n\n\"People will keep eating\" \n\n\"Software is easier than hardware\" \n\n\"Vanity never dies\"\n\nBuffett got rich on sugar water and insurance. \n\nNot quantum physics.\n\nComplexity is where amateurs hide their uncertainty."}, {"r": 36, "rs": 1, "rp": 2, "d": "2026-01-15", "b": "Your portfolio is a relationship.\n\nSome people marry their stocks. \n\nOthers are dating. \n\nMost are on Tinder - swiping, chasing, ghosting.\n\nCommitment compounds. \n\nDecide what you are here for."}, {"r": 28, "rs": 0, "rp": 3, "d": "2026-01-16", "b": "Cartographers map territory they've never walked.\n\nThey synthesize reports. \n\nThey triangulate data. \n\nThey accept incompleteness.\n\nYou will never have full information. \n\nThe map is always wrong somewhere.\n\nInvest anyway. \n\nUpdate the map as you go."}, {"r": 18, "rs": 0, "rp": 1, "d": "2026-01-19", "b": "Theologians once described God only by what He is not. \n\nThey called it apophatic theology.\n\nTry apophatic investing: Define your strategy by what you will never do.\n\nI will never invest in what I don't understand. \n\nI will never bet money I can't afford to lose. \n\nI will never act from fear or greed alone.\n\nConstraints create clarity. \n\nKnowing your \"nevers\" is knowing yourself."}, {"r": 3, "rs": 1, "rp": 0, "d": "2026-01-19", "b": "$CORT: The Bottom Is In\n\nCorcept dropped 60% in 3 months. Everyone sees a falling knife.\n\nI see accumulation.\n\nThe December VPOC (VPOC = the price where most volume traded) sits at $35.79 exactly where price has been building a base for 3 weeks. \n\nWhen a stock crashes then consolidates on heavy volume, that's smart money loading."}, {"r": 27, "rs": 2, "rp": 4, "d": "2026-01-22", "b": "Librarians understand: not every book deserves the front shelf.\n\nNot every stock deserves your attention.\n\nCurate ruthlessly. \n\nA cluttered portfolio is a cluttered mind."}, {"r": 10, "rs": 1, "rp": 1, "d": "2026-01-23", "b": "You're not behind.\n\nThe person who started 10 years ago also thought they were late.\n\nThe best time to start was yesterday. \n\nThe second best time is now."}, {"r": 5, "rs": 0, "rp": 0, "d": "2026-01-26", "b": "Your Biggest Loss Will Come From Your Greatest Strength\n\nRead that again.\n\nThe analyst who's brilliant at finding undervalued companies? \n\nThey'll hold a dying business too long because they \"see the value others miss.\n\nThe trader with perfect timing? \n\nThey'll overtrade during a sideways market because they're \"good at catching moves.\n\nThe investor who never panics? \n\nThey'll ride a position to zero because they \"don't let emotions dictate decisions.\n\nYour edge will become your trap.\n\nNot because the strength failed. \n\nBut because you'll apply it where it doesn't belong. \n\nAnd you won't see it coming. \n\nBecause it won't feel like a mistake. \n\nIt'll feel like being yourself.\n\nThe hardest lesson in markets: Your superpower has a shadow. \n\nAnd that shadow will find you exactly when you think you've mastered the game.\n\nMastery isn't perfecting your strength. \n\nIt's knowing when your strength becomes a liability."}, {"r": 2, "rs": 1, "rp": 0, "d": "2026-01-29", "b": "CPSH: +85% Since My November Recommendation\n\nI recommended CPS Technologies at $3.45 on November 16th. It is now trading at $6.40. That is an 85% return in two months.\n\nThe fundamental case was straightforward. CPS Technologies is a specialty materials company serving the defense and electronics industries. Profitable. Positive cash flow. Clean balance sheet. \n\nThe technical setup confirmed the timing. The stock had been in a prolonged downtrend, but the structure was shifting. EMA crossover forming on the weekly chart. Higher lows building. The pattern was classic accumulation before a breakout.\n\nI shared the entry zone, the stop loss, and the thesis before it moved. Not after.\n\nThis is what I do every week. Every Sunday I publish a full market recap covering breadth, volatility, intermarket divergences, and the signals that matter. Each recap includes a Trade of the Week with specific entries, stops, and targets.\n\nThroughout the week I also send alerts when my screeners flag high-conviction setups.\n\nIf you want access to the analysis, the trade ideas, and the alerts, don’t hesitate to subscribe!"}, {"r": 45, "rs": 0, "rp": 5, "d": "2026-01-29", "b": "Bull market rules don't work in bear markets. \n\nBear market rules don't work in bull markets.\n\nThe first question isn't \"what should I buy?\" \n\nIt's \"what regime are we in?\"\n\nTrade the regime, not the ticker."}, {"r": 19, "rs": 1, "rp": 1, "d": "2026-01-31", "b": "You think you're free? \n\nCheck your screen time. \n\nCount how many times you opened the app today.\n\nThat's not investing. \n\nThat's possession.\n\nThe ticker moves. \n\nYou twitch. \n\nIt drops. \n\nYou sweat. \n\nIt pumps. \n\nYou feel alive.\n\nYou're not the owner. \n\nYou're the dog. \n\nAnd the market holds the leash."}, {"r": 9, "rs": 0, "rp": 2, "d": "2026-02-01", "b": "Troy had walls for 10 years. \n\nImpenetrable. \n\nLegendary. \n\nSafe.\n\nOne wooden horse. \n\nOne night of celebration. \n\nGone.\n\nYour portfolio has walls too. \n\nDiversification. \n\nStop losses. \n\nRules.\n\nOne moment of greed opens the gate."}, {"r": 4, "rs": 0, "rp": 0, "d": "2026-02-01", "b": "\n\n\n\nBreadth Score at 68/100 — healthy, internals improving with 57 new highs, A/D Ratio at 3.91, McClellan Summation turning positive\n\n\n\n\n\nVIX at 17.01 — Master Signal ELEVATED at 3/14. Oil vol at 93rd percentile, gold vol at 87th percentile. Equity VIX calm, but commodities are pricing in geopolitical stress\n\n\n\n\n\nTrade of the Week: CUBI — regional bank breaking out to all-time highs above $79, fundamental score 7.6/10\n\n"}, {"r": 209, "rs": 14, "rp": 48, "d": "2026-02-03", "b": "I know a guy who only checks his portfolio twice a year.\n\nHis criteria: dividend paid for 25+ years. \n\nThat's it.\n\nNo rebalancing. \n\nNo timing. \n\nNo CNBC.\n\n\"If they've paid me every quarter since I was in college, why would I sell?\"\n\nHe sleeps 8 hours a night and has $2.3M."}, {"r": 105, "rs": 11, "rp": 23, "d": "2026-02-06", "b": "If an investment keeps you up at 3am, sell it.\n\nNot because it's a bad investment. \n\nBecause you can't handle it.\n\nRisk isn't math. \n\nRisk is what you can stomach without breaking.\n\nKnow your sleep number."}, {"r": 3, "rs": 1, "rp": 0, "d": "2026-02-08", "b": "Market recap just published"}, {"r": 33, "rs": 3, "rp": 4, "d": "2026-02-09", "b": "In 1929, Joe Kennedy got his shoes shined.\n\nThe shoeshine boy started giving him stock tips.\n\nKennedy went back to his office and sold everything.\n\nWeeks later, the market crashed 86%.\n\nWhen the people who have no business investing start giving advice, the smart money is already heading for the exit.\n\nThe best market indicator isn't a chart. \n\nIt's the taxi driver telling you to buy crypto."}, {"r": 6, "rs": 2, "rp": 0, "d": "2026-02-09", "b": "Everybody is talking about the tech selloff.\n\nNobody is talking about what replaced it.\n\nEnergy +14% in 20 days.\n\n Consumer Staples +11%. \n\nIndustrials +7%. \n\nMaterials +7%.\n\nTech -3.4%. \n\nCommunications -1.8%.\n\nThe market didn't crash. It rotated. \n\nMoney left the digital economy and went straight into the real economy.\n\nFull divergence analysis, breadth dashboard, volatility breakdown, and this week's trade 👇 https://philosopherinvestor.substack.com/p/tech-down-34-energy-up-14-the-rotation"}, {"r": 106, "rs": 8, "rp": 27, "d": "2026-02-11", "b": "Most people diversify by buying 12 tech stocks and calling it a portfolio.\n\nReal diversification is owning assets that argue with each other.\n\nWhen your equities bleed, your bonds should breathe. \n\nWhen your growth lags, your value should lead.\n\nA portfolio is not a collection of bets.\n\nIt's a system of counterweights."}, {"r": 5, "rs": 1, "rp": 1, "d": "2026-02-15", "b": "Breadth dropped 16 points in one week. VIX just breached 20 for the first time since January. \n\nThe market is still standing. But the posture has changed.\n\nThis week's recap covers what the dashboards are saying, where the rotation is heading, and one trade setup on a healthcare monopoly trading at capitulation prices with 90% gross margins.\n\nFull breakdown inside 👇"}, {"r": 21, "rs": 4, "rp": 4, "d": "2026-02-16", "b": "Jesse Livermore's first rule:\n\n\"Never average down in a losing position.\"\n\nHe learned this at 15 in illegal bucket shops.\n\nLost everything twice before age 25.\n\nThen made millions. \n\nThen lost millions. \n\nThen made millions again.\n\nHe didn't fail because he lacked skill. \n\nHe failed because he broke his own rules.\n\nWrite your rules down. \n\nThen tattoo them on your brain.\n\nThe market won't kill you. \n\nYour exceptions will."}, {"r": 8, "rs": 1, "rp": 1, "d": "2026-02-18", "b": "In 1750s Japan, there was no stock market.\n\nNo Wall Street. No trading apps. No CNBC.\n\nBut there was rice. And rice was money.\n\nIn the port city of Sakata, a young man named Munehisa Homma watched his brothers fail at trading. They were emotional. Impulsive. They bought when excited and sold when scared.\n\nHomma took a different path.\n\nHe didn't start trading. He started watching.\n\nFor years, he sat in rice markets taking notes. Not on prices, on people. What made them panic. What made them greedy. What made them freeze.\n\nThen, and only then, did he start trading.\n\nHe won. And won. And won again.\n\nOver 100 consecutive winning trades, according to legend.\n\nHis secret was never information. It was understanding that every price movement is just a human emotion wearing a number.\n\nLearn the emotion. Ignore the noise.\n\nThat lesson was worth $10 billion in 1755. It's worth even more today."}, {"r": 11, "rs": 0, "rp": 0, "d": "2026-02-19", "b": "Jealousy is free financial advice.\n\nWhen you feel jealous of someone's returns, don't suppress it. \n\nExamine it.\n\nIt's showing you what you actually want but haven't given yourself permission to pursue.\n\nJealous of the guy who went all-in on NVDA? \n\nMaybe you don't trust your own conviction.\n\nJealous of the woman who retired at 40? \n\nMaybe you're optimizing for income when you want time.\n\nYour envy is a map. \n\nMost people throw it away."}, {"r": 6, "rs": 0, "rp": 1, "d": "2026-02-19", "b": "Jealousy is free financial advice.\n\nWhen you feel jealous of someone's returns, don't suppress it. \n\nExamine it.\n\nIt's showing you what you actually want but haven't given yourself permission to pursue.\n\nJealous of the guy who went all-in on NVDA? \n\nMaybe you don't trust your own conviction.\n\nJealous of the woman who retired at 40? \n\nMaybe you're optimizing for income when you want time.\n\nYour envy is a map. \n\nMost people throw it away."}, {"r": 12, "rs": 0, "rp": 5, "d": "2026-02-19", "b": "Somebody just dropped $5.4M on MSTR $137 calls expiring in 8 days. Stock is down 3% on the week and nobody talking about it.\n\nThis scored 77.1 on my screener. \n\nHighest signal in the entire market today.\n\nIf this prints that person is a genius lol"}, {"r": 4, "rs": 2, "rp": 0, "d": "2026-02-22", "b": "Two aircraft carriers heading to Iran. Oil vol at the 97th percentile. FX markets flipping risk-off.\n\nAnd somehow the VIX went down this week.\n\nThe equity market and the commodity market are telling two different stories. One of them is wrong.\n\nThis week's recap: which market to trust, why I just booked +46% on ZIM before the $35 acquisition closes, and a silver miner pulling back -20% with a screener score of 90/100.\n\nFull analysis with dashboards and charts inside."}, {"r": 58, "rs": 5, "rp": 10, "d": "2026-02-23", "b": "Most people think patience means waiting for green days.\n\nReal patience is watching someone else get rich on a trade you deliberately avoided.\n\nIt's sitting with your 8% while Twitter celebrates 400% overnight. \n\nIt's trusting your system when your emotions are screaming mutiny.\n\nPatience isn't passive. It's the hardest action you'll ever take with your money."}, {"r": 7, "rs": 0, "rp": 2, "d": "2026-02-24", "b": "In 2002, Amazon wasn't an \"internet company.\"\n\nIt was a bookstore that happened to use the internet better than anyone else on earth.\n\nThe internet was the enabler. \n\nRetail was the battlefield. \n\nEfficiency was the weapon.\n\nIn 2030, the biggest AI winner won't be an \"AI company.\"\n\nIt will be a healthcare company. \n\nOr an insurance company. \n\nOr a logistics company.\n\nThat happens to use AI better than anyone else on earth."}, {"r": 47, "rs": 1, "rp": 4, "d": "2026-02-26", "b": "In 1987 the VIX didn't exist yet.\n\nThere was no fear index. \n\nNo number for panic.\n\nTraders looked at each other's faces to measure how bad it was.\n\nToday we have algorithms measuring fear to five decimal places.\n\nWe still panic the exact same way.\n\nWe didn't solve fear. \n\nWe just gave it a ticker symbol."}, {"r": 8, "rs": 0, "rp": 1, "d": "2026-02-26", "b": "I scan 3,000+ US stocks through my models every day. Most days, nothing stands out.\n\nToday something stood out.\n\n$3.8 million in ATM calls on a single name. \n\nFour catalysts between now and expiry.\n\nFull breakdown just went live.\n\nTicker is $EQT"}, {"r": 18, "rs": 0, "rp": 5, "d": "2026-03-01", "b": "500 subscribers. Target hit. 🎯\n\n10 weeks ago, we crossed 200. \n\nI said next target: 500.\n\nDone.\n\nThank you for reading.\n\nThank you for sharing.\n\nThank you for trusting the process.\n\nNext target: 1,000.\n\nWe're not slowing down. 🚀"}, {"r": 10, "rs": 0, "rp": 1, "d": "2026-03-01", "b": "This week's recap is different.\n\nThe US and Israel struck Iran on Saturday. \n\nKhamenei is dead. \n\nTankers are turning around at Hormuz. \n\nShip traffic dropped 50% in hours.\n\nBut the data was there before the bombs fell. \n\nThe put/call ratio tripled in two days. \n\nOil vol hit a very high level.\n\nBanks collapsed 23 points of breadth.\n\nThis is the full breakdown."}, {"r": 17, "rs": 0, "rp": 1, "d": "2026-03-03", "b": "The Iraq war didn't cost $800 billion.\n\nIt cost $3 trillion.\n\nAnd the cheap money the Fed printed to cushion it? \n\nIt flooded straight into housing.\n\n2003 planted the seeds of 2008.\n\nEvery crisis has roots nobody traces back far enough."}, {"r": 95, "rs": 12, "rp": 14, "d": "2026-03-04", "b": "Read books written s give you a reason not to invest.\n\nWar. \n\nRecession. \n\nInflation. \n\nCrisis.\n\nAnd yet the market has gone up every single decade for over a century.\n\nBet on time. \n\nNot on headlines."}, {"r": 3, "rs": 1, "rp": 0, "d": "2026-03-24", "b": "In 2024, healthcare policy uncertainty hit a decade low.\n\nTwelve months later, it nearly matched COVID.\n\nNot because of a virus. \n\nBecause one administration decided to restructure the entire US health system in a single year.\n\n25% budget cut to HHS. \n\n20,000 jobs eliminated. \n\nCDC slashed by 54%. \n\nNIH by 40%. \n\nACA subsidies gone.\n\nAnd here's the part nobody's pricing in. \n\nThe index hasn't come back down. \n\nFour times the historical norm.\n\nCOVID uncertainty resolved because the virus was understood. \n\nPolicy uncertainty doesn't resolve. \n\nEvery hospital CFO, every pharma R&D team, every insurer building 2027 models is flying blind."}, {"r": 128, "rs": 16, "rp": 28, "d": "2026-03-25", "b": "Your portfolio was up 12% this year.\n\nThen your coworker mentioned he doubled his money on Nvidia.\n\nAnd suddenly 12% felt like failure.\n\nIt wasn't. \n\n12% compounded over 20 years turns €50k into €480k.\n\nBut nobody makes a TikTok about 12%.\n\nOne loud number from the wrong mouth can destroy a decade of discipline."}, {"r": 8, "rs": 1, "rp": 0, "d": "2026-03-29", "b": "VIX spiked +13% to 31 on Friday. \n\nFive straight red weeks. \n\nEvery headline screaming danger.\n\nBut something shifted underneath.\n\nFor the first time in five weeks, the selling pressure actually eased.\n\nApril 6 decides which one is right.\n\nFull breakdown 👇"}, {"r": 66, "rs": 7, "rp": 15, "d": "2026-03-31", "b": "\"I'll sell when I get back to breakeven.\"\n\nThe most expensive sentence in finance.\n\nIt turns a 3-week mistake into a 3-year hostage situation.\n\nThe stock doesn't know your entry price. \n\nThe stock doesn't owe you a round trip.\n\nBreakeven is not a strategy."}, {"r": 27, "rs": 2, "rp": 1, "d": "2026- r": 7, "rs": 1, "rp": 1, "d": "2026-05-19", "b": "In 1730, rice prices in Japan fell hard.\n\nThat mattered because samurai income was tied to rice.\n\nWhen rice got cheaper, the warrior class did not just lose purchasing power. The political order started to shake.\n\nSo the Tokugawa shogunate stepped in.\n\nIt recognized the Dojima rice market in Osaka and tried to support prices by pulling rice supply out of the market.\n\nNot to protect the buyer.\n\nTo protect the class whose wealth was priced in rice.\n\nThat is the part worth remembering.\n\nGovernments do not rescue “markets” in the abstract.\n\nThey rescue the markets that sit underneath the political system.\n\nIn Tokugawa Japan, that market was rice.\n\nIn the next crisis, it will be whatever asset class the rule-writers cannot afford to let break.\n\nSo if you want to know what gets saved next, do not just study charts.\n\nStudy who writes the rules.\n\nThen study what they own."}, {"r": 4, "rs": 0, "rp": 0, "d": "2026-05-24", "b": "The S&P hit new highs this week. \n\nThe median stock didn't move.\n\nNew letter is live. \n\nFull breakdown of why I think the top is near, why the data hasn't confirmed it yet, and the one trade I'm taking from 100% cash.\n\n👇"}, {"r": 9, "rs": 0, "rp": 4, "d": "2026-05-25", "b": "800 subs today. \n\nStill feels surreal that strangers read what I write every week.\n\n1000 is next. \n\nIf you've ever forwarded this to someone, thank you. \n\nIf you haven't, now is the time."}, {"r": 9, "rs": 1, "rp": 0, "d": "2026-05-28", "b": "Every billionaire owns the same thing:\n\nOther people's time, multiplied.\n\nEmployees' hours. \n\nShareholders' patience. \n\nCustomers' habits.\n\nWealth is just time arbitrage at scale."}, {"r": 6, "rs": 0, "rp": 1, "d": "2026-05-31", "b": "I spent the month in cash waiting for a top. \n\nThis week oil crashed 14%, the index hit new highs, and half my bear case just walked off the field. \n\nSo I did the only honest thing and changed my read. \n\n llion in a day was near impossible.\n\nOn August 21 they lost $553 million in a single day.\n\nA month later, fourteen banks took the fund over in a room at the New York Fed.\n\nTheir trades were sound. \n\nMost of those positions made money later.\n\nFor the banks that bought them.\n\nThey had $25 of exposure for every $1 of real capital.\n\nThere is no coming back. \n\nNo second chance to be proven right.\n\nYour edge means nothing if one bad week removes you from the table.\n\nNever go all in. \n\nRisk 1% per trade. \n\nStay alive long enough for your edge to show up."}, {"r": 9, "rs": 0, "rp": 0, "d": "2026-07-26", "b": "Alphabet raised its AI budget to $205 billion. \n\nThe market sold it.  \n\nThen it spent the week bidding up Nvidia and Broadcom, the companies cashing those checks.  \n\nThe market believes the spending works. \n\nIt just does not want to own the bill. \n\nFull story in this week's recap."}, {"r": 23, "rs": 2, "rp": 1, "d": "2026-07-27", "b": "Really like this article, read it!"}, {"r": 7, "rs": 0, "rp": 0, "d": "2026-07-27", "b": "Ask a trader what he wants to make this year. \n\nHe answers in one second.\n\nAsk him what number would end him. \n\nSilence.\n\nThe second question is annoying because you have to open the app and actually do the math.\n\nSo do the math.\n\nFind the number that makes you quit. \n\nThe one that makes you lie about it at dinner.\n\nThen size every position so you never get near it."}, {"r": 25, "rs": 3, "rp": 2, "d": "2026-07-29", "b": "lol"}, {"r": 23, "rs": 0, "rp": 7, "d": "2026-07-30", "b": "One year ago, this newsletter had 160 subscribers. \n\nToday we crossed 1,000. 🎉🥂 \n\nThank you 🙏  \n\nPS: I'm working very hard on the app behind the paid tier. Screeners, options flow, congress trades, and new features shipping every week. \n\nYou can try it free for 7 days here: https://philosopherinvestor.substack.com/subscribe?coupon=d30ae56d\n\nNext: publish more, cover more ground (macro reads, trade ideas, etc), and let tab="notes", sortK="r", q="";
const list=document.getElementById("list"), count=document.getElementById("count");
if(location.hash==="#articles"){tab="articles";}

function noteRow(n){
  const row=document.createElement("div"); row.className="row";
  const stats=document.createElement("div"); stats.className="stats";
  stats.innerHTML=`<span><b>❤ ${n.r}</b></span><span>♻️ ${n.rs}</span><span>💬 ${n.rp}</span><span>${n.d}</span>`;
  const txt=document.createElement("div"); txt.className="txt";
  txt.textContent=n.b.length>180?n.b.slice(0,180).trim()+"…":n.b;
  const full=document.createElement("div"); full.className="full"; full.textContent=n.b;
  row.append(stats,txt,full);
  row.onclick=()=>{row.classList.toggle("open");};
  return row;
}
function articleRow(a){
  const row=document.createElement("a"); row.className="row";
  row.href=`https://${DATA.pub}.substack.com/p/${a.slug}`; row.target="_blank"; row.rel="noopener";
  const stats=document.createElement("div"); stats.className="stats";
  stats.innerHTML=`<span><b>❤ ${a.r}</b></span><span>♻️ ${a.rs}</span><span>💬 ${a.c}</span><span>${a.d}</span>`;
  const h=document.createElement("h3"); h.textContent=a.t;
  row.append(stats,h);
  if(a.s){const sc=document.createElement("div"); sc.className="sc"; sc.textContent=a.s; row.append(sc);}
  return row;
}
function hay(x){return ((x.b||"")+" "+(x.t||"")+" "+(x.s||"")).toLowerCase();}
function render(){
  const src=(tab==="notes"?DATA.notes:DATA.articles).slice();
  const qq=q.trim().toLowerCase();
  const filt=qq?src.filter(x=>hay(x).includes(qq)):src;
  filt.sort((a,b)=> sortK==="d" ? (b.d>a.d?1:b.d<a.d?-1:0) : (b[sortK]-a[sortK]));
  list.innerHTML="";
  count.textContent = filt.length + (qq?" match"+(filt.length===1?"":"es"):"");
  if(!filt.length){list.innerHTML='<div class="empty">Nothing here.</div>';return;}
  const mk=tab==="notes"?noteRow:articleRow, frag=document.createDocumentFragment();
  filt.forEach(x=>frag.append(mk(x)));
  list.append(frag);
}
document.querySelectorAll(".tab").forEach(b=>{
  if(b.dataset.tab===tab)b.classList.add("on"); else b.classList.remove("on");
  b.onclick=()=>{document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
    b.classList.add("on"); tab=b.dataset.tab; render();};
});
document.querySelectorAll(".sort").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".sort").forEach(t=>t.classList.remove("on"));
  b.classList.add("on"); sortK=b.dataset.k; render();});
document.getElementById("q").oninput=e=>{q=e.target.value; render();};
render();
</script>
