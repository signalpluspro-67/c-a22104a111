<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Répondre</title><meta name="robots" content="noindex">
<style>body{margin:0;background:#15100e;color:#f3ece0;font:18px -apple-system,Roboto,sans-serif;padding:24px}
a.b{display:block;text-align:center;padding:22px;margin:16px 0;border-radius:14px;background:#b5532a;color:#fff;font-size:22px;font-weight:700;text-decoration:none}
a.s{background:#3a302b;font-size:17px;font-weight:500}p{white-space:pre-wrap;line-height:1.4;opacity:.85}</style></head>
<body><a class="b" id="app">🚀 Répondre dans X</a><a class="b s" id="web">Ça n'a pas marché ? Version web</a><p id="txt"></p>
<script>
var q=new URLSearchParams(location.search),t=q.get("t")||"",m=q.get("m")||"",e=encodeURIComponent;
document.getElementById("txt").textContent=m;
var android=/Android/i.test(navigator.userAgent);
document.getElementById("app").href=android
 ?"intent://post?message="+e(m)+"&in_reply_to_status_id="+t+"#Intent;scheme=twitter;package=com.twitter.android;end"
 :"twitter://post?message="+e(m)+"&in_reply_to_status_id="+t;
document.getElementById("web").href="https://twitter.com/intent/tweet?in_reply_to="+t+"&text="+e(m);
</script></body></html>
